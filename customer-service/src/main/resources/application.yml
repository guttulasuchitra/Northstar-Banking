server:
  port: 8081
spring:
  application:
    name: customer-service
  datasource:
    url: jdbc:h2:mem:customerdb
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
