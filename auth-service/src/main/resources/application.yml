server:
  port: 8083
spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:h2:mem:authdb
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
jwt:
  # must be identical in api-gateway (min 32 chars)
  secret: northstar-bank-super-secret-key-change-me-12345
  expiration-ms: 3600000
