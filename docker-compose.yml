
services:
  eureka-server:
    build:
      context: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - northstar-network

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - northstar-network

  customer-service:
    build:
      context: ./customer-service
    container_name: customer-service
    ports:
      - "8081:8081"
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - northstar-network

  account-service:
    build:
      context: ./account-service
    container_name: account-service
    ports:
      - "8082:8082"
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - northstar-network

  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    ports:
      - "8083:8083"
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - northstar-network
  frontend:
    build:
      context: ./customer-account-frontend-docker/customer-account-frontend
    container_name: bank-frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - northstar-network

networks:
  northstar-network:
    driver: bridge


